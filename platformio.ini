; =============================================================
;  Medidor DC con protecciones - ESP32 DevKit V1 (ESP32-WROOM-32)
;  Dos programas en el mismo proyecto (elige el entorno en la
;  barra inferior de VS Code):
;    env:principal   -> src/principal/    medidor + protecciones + MQTT
;    env:calibracion -> src/calibracion/  calibración del INA219
;  Pines y rango del sensor: include/hardware_config.h
;  WiFi y DEVICE_ID:         include/secrets.h
; =============================================================
[platformio]
default_envs = principal

[env]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

[env:principal]
build_src_filter = +<principal/>
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0

[env:calibracion]
build_src_filter = +<calibracion/>